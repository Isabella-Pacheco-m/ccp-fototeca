{% extends "accounts/_base_acceso.html" %}

{% block titulo %}Cerrar sesión{% endblock %}

{% block acceso %}
<div class="tarjeta-confirmacion">
  <h1 style="font-size:1.7rem">¿Cerrar sesión?</h1>
  <p style="color:var(--tinta-suave)">Saldrás de la Fototeca en este dispositivo.</p>
  <form method="post" style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem">
    {% csrf_token %}
    <button type="submit" class="boton">Sí, cerrar sesión</button>
    <a class="boton boton--fantasma" href="{% url 'gallery:galeria' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
