{% extends "core/base.html" %}

{% block titulo %}Error {{ codigo }}{% endblock %}

{% block contenido %}
<section class="contenedor" style="padding: clamp(3rem, 10vw, 6rem) 0; max-width: 640px;">
  <p class="portada__etiqueta">Error {{ codigo }}</p>
  <h1>{{ titulo }}</h1>
  <p style="color: var(--tinta-suave); font-size: 1.05rem;">{{ mensaje }}</p>
  <div class="acciones-detalle">
    <a class="boton" href="{% url 'gallery:galeria' %}">Volver a la galería</a>
    {% if not user.is_authenticated %}
      <a class="boton boton--contorno" href="{% url 'accounts:ingresar' %}">Ingresar</a>
    {% endif %}
  </div>
</section>
{% endblock %}
